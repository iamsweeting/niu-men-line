name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (指标/判读/解析)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: python -m pytest tests -v

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Cache Buildozer global
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: ${{ runner.os }}-pip-cache

      - name: Download CJK fonts
        run: bash tools/fetch_fonts.sh

      - name: Prepare cache dirs
        run: mkdir -p ~/.buildozer ~/.gradle ~/.cache ~/.local

      - name: Build APK (Buildozer Docker)
        run: |
          # 1) --entrypoint bash：镜像自带入口脚本（UID 映射）的行为随镜像版本变化，
          #    直接以 bash 为入口消除不确定性；配合 --user 与宿主机 UID 一致，挂载目录可写。
          # 2) 容器内 pip>=24 时 p4a 会报 "cannot import name 'BuildDependencyInstallError'"
          #    （pip 24 移除了该内部异常），因此先降级 pip<24：--user 安装到挂载的
