name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (指标/判读/解析)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: python -m pytest tests -v

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Cache Buildozer global
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          # key 含 -py310-v3- 标记：旧缓存含 Python 3.14 时代的 p4a 环境/hostpython3，
          # 恢复会导致版本不匹配等错误复现；每次切换 Python 版本都需升级该标记（v3/v4/...）。
          key: ${{ runner.os }}-buildozer-py310-v3-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-py310-v3-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: ${{ runner.os }}-pip-cache

      - name: Download CJK fonts
        run: bash tools/fetch_fonts.sh

      - name: Prepare cache dirs
        run: mkdir -p ~/.buildozer ~/.gradle ~/.cache ~/.local

     
      - name: Build APK via buildozer docker
        run: |
          # 容器内执行 tools/docker_build.sh（经 $PWD 挂载可见）：
          #   自动选择 3.10-3.12 Python 建独立 venv -> 装最新 buildozer+cython+pip<24
          #   -> 把 buildozer.spec 的 python3 钉版动态改为该 Python 确切版本（消除
          #      hostpython3 版本不匹配）-> 清理镜像预置旧 python 产物 -> 构建。
          # 注：p4a 下载依赖源码（SDK/NDK/freetype 等）偶发 502 Bad Gateway，
          # 故外层重试整轮构建（缓存保留，重试只补缺的下载）。
          set +e
          ok=0
          for attempt in 1 2 3 4 5; do
            echo "===== build attempt $attempt ====="
            sudo docker run --rm \
              --entrypoint /bin/bash \
              -v "$PWD":/home/user/hostcwd \
              -v "$HOME/.buildozer":/home/user/.buildozer \
              -v "$HOME/.gradle":/home/user/.gradle \
              -v "$HOME/.cache":/home/user/.cache \
              --workdir /home/user/hostcwd \
              kivy/buildozer:latest \
              -c 'bash tools/docker_build.sh'
            if [ $? -eq 0 ] && ls bin/*.apk >/dev/null 2>&1; then
              ok=1
              break
            fi
            echo "===== attempt $attempt failed, retrying ====="
          done
          set -e
          if [ "$ok" != "1" ]; then
            echo "ALL BUILD ATTEMPTS FAILED"
            exit 1
          fi
        timeout-minutes: 180

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: niumen-apk
          path: bin/*.apk
          if-no-files-found: error
