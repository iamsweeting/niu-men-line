name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (指标/判读/解析)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: python -m pytest tests -v

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Cache Buildozer global
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: ${{ runner.os }}-pip-cache

      - name: Download CJK fonts
        run: bash tools/fetch_fonts.sh

      - name: Prepare cache dirs
        run: mkdir -p ~/.buildozer ~/.gradle ~/.cache

      - name: Build APK (Buildozer Docker)
        run: |
          # 注意：不要加 --user 参数 —— kivy/buildozer 镜像的入口脚本以 root 启动，
          # 自动按宿主机 UID/GID 创建用户并降权运行 buildozer（加了 --user 会因
          # groupadd 无权限而失败，报 groupadd: Permission denied / exit code 10）。
          sudo docker run --rm \
            --entrypoint bash \
            -v "$PWD":/home/user/hostcwd \
            -v "$HOME/.buildozer":/home/user/.buildozer \
            -v "$HOME/.gradle":/home/user/.gradle \
            -v "$HOME/.cache":/home/user/.cache \
            --workdir /home/user/hostcwd \
            kivy/buildozer:latest \
            bash -lc "pip install 'pip<24' && buildozer -v android debug"
        timeout-minutes: 120

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: niumen-apk
          path: bin/*.apk
          if-no-files-found: error
