name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (指标/判读/解析)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: python -m pytest tests -v

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Cache Buildozer global
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          # key 含 -py310-v2- 标记：缓存里的 p4a 环境/hostpython3 是 Python 3.14 时代构建的，
          # 恢复会导致 python3/hostpython3 版本不匹配（3.10.14 != 3.14.2）等错误复现；
          # 每次切换 Python 版本都需升级该标记（v2/v3/...）强制全新构建。
          key: ${{ runner.os }}-buildozer-py310-v2-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-py310-v2-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: ${{ runner.os }}-pip-cache

      - name: Download CJK fonts
        run: bash tools/fetch_fonts.sh

      - name: Prepare cache dirs
        run: mkdir -p ~/.buildozer ~/.gradle ~/.cache ~/.local

     
      - name: Build APK via buildozer docker
        run: sudo docker run --rm --entrypoint /bin/bash -v "$PWD":/home/user/hostcwd -v "$HOME/.buildozer":/home/user/.buildozer -v "$HOME/.gradle":/home/user/.gradle -v "$HOME/.cache":/home/user/.cache --workdir /home/user/hostcwd kivy/buildozer:latest -c 'pip install --break-system-packages "pip<24" && echo y | buildozer -v android debug'
        timeout-minutes: 120

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: niumen-apk
          path: bin/*.apk
          if-no-files-found: error
